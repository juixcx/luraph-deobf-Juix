services:
  - type: web
    name: luraph-deobf
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      git clone --depth=1 https://github.com/KryptIT/luraph-v15-v14.x-deobfuscator.git /tmp/luraph-deobf || true
      cd /tmp/luraph-deobf/Deobfuscator/deobf && pip install -r requirements.txt || true
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 600 --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
