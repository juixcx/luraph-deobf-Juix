<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luraph · Prometheus · MoonSec · Moonveil — Deobfuscator</title>
<link rel="icon" href="/static/logo.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">

    <header>
        <img src="/static/logo.png" alt="logo" class="logo" onerror="this.style.display='none'">
        <div>
            <h1>Multi Deobfuscator</h1>
            <p class="subtitle">
                Luraph v14.9 · Prometheus · MoonSec V2/V3 · Moonveil
                <a href="https://github.com/KryptIT/luraph-v15-v14.x-deobfuscator"
                   target="_blank" class="link">[repo]</a>
            </p>
        </div>
    </header>

    <section class="panel">
        <h2>1. Input</h2>

        <label style="display:block;color:#6c7680;font-size:12px;margin-bottom:6px;">
            Obfuscator:
        </label>
        <select id="engineSelect"
            style="width:100%;background:#0a0e14;border:1px solid #1f2937;color:#c5c8c6;padding:10px 12px;border-radius:4px;font-family:monospace;font-size:13px;margin-bottom:12px;">
            <option value="luraph_14.9">Luraph v14.9</option>
            <option value="prometheus">Prometheus</option>
            <option value="moonsec_v3">MoonSec V3</option>
            <option value="moonsec_v2">MoonSec V2</option>
            <option value="moonveil">Moonveil</option>
        </select>

        <input type="text" id="scriptUrl"
               placeholder="https://raw.githubusercontent.com/.../script.lua">
        <div class="divider">— OR —</div>
        <textarea id="scriptBody"
            placeholder="paste obfuscated code here"></textarea>
        <div class="btn-row">
            <button id="btnFetch" class="secondary">Fetch URL</button>
            <button id="btnAnalyze">Analyze</button>
            <button id="btnDeobf">Deobfuscate</button>
            <button id="btnClear" class="secondary">Clear</button>
        </div>
        <div id="status" class="status" style="display:none;"></div>
    </section>

    <section class="panel" id="analysisPanel" style="display:none;">
        <h2>2. Analysis</h2>
        <div class="info-grid" id="infoGrid"></div>
    </section>

    <section class="panel" id="outputPanel" style="display:none;">
        <h2>3. Output</h2>
        <div class="btn-row">
            <button id="btnDownload" class="secondary">Download .lua</button>
            <button id="btnCopy" class="secondary">Copy</button>
        </div>
        <pre id="outputPre"></pre>
    </section>

    <footer>
        <a href="https://discord.gg/kurokoai" class="link">discord.gg/kurokoai</a>
    </footer>

</div>
<script src="/static/app.js"></script>
</body>
</html>
